# ==========================================================
# Contoh VirtualHost HTTPS untuk proyek HRIS ini di XAMPP.
# Tempelkan blok ini ke dalam file:
#   C:\xampp\apache\conf\extra\httpd-ssl.conf
# (letakkan di bagian PALING BAWAH file tersebut)
#
# Sesuaikan dulu:
#   - "namahost.local" boleh dibiarkan apa adanya (tidak wajib
#     didaftarkan di DNS, karena kita akan akses via IP juga).
#   - Path SSLCertificateFile & SSLCertificateKeyFile di bawah
#     arahkan ke lokasi hris-selfsigned.crt / .key hasil
#     generate-ssl-cert.bat (bisa dibiarkan seperti contoh kalau
#     kamu copy filenya ke folder conf\ssl.crt dan conf\ssl.key).
# ==========================================================

Listen 443
<VirtualHost *:443>
    DocumentRoot "C:/xampp/htdocs/hris-php-mvc/public"
    ServerName localhost
    ServerAlias 10.31.101.80

    SSLEngine on
    SSLCertificateFile "C:/xampp/apache/conf/ssl.crt/hris-selfsigned.crt"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.key/hris-selfsigned.key"

    <Directory "C:/xampp/htdocs/hris-php-mvc/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
